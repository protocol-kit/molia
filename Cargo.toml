[package]
name = "molia"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Shared-nothing, zero-allocation DHT (design-phase implementation)"
license = "MIT OR Apache-2.0"

[dependencies]
arrayvec = "0.7"
blake3 = "1"
bytes = "1"
crc32fast = "1"
ed25519-dalek = { version = "1.0.1", features = ["std"] }
hex = "0.4"
polling = "3"
prost = "0.13"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reed-solomon-erasure = "6"
socket2 = { version = "0.5", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
boringtun = "0.6"
str0m = { version = "0.23", default-features = false, features = ["openssl", "vendored"] }

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[features]
default = []
allocation-tracking = []

[[bin]]
name = "molia"
path = "src/bin/molia.rs"
